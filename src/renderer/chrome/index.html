<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ruh</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="chrome.css" />
</head>
<body>
  <div id="chrome-root">
    <div class="titlebar-spacer"></div>

    <!-- Separate layout (default): toolbar row + its own tab bar row below -->
    <div id="layout-separate">
      <div class="toolbar-row">
        <div id="toolbar"></div>
        <div id="address-bar"></div>
        <button class="icon-btn settings-toggle-btn" data-tooltip="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.14 7.14 0 0 0-.06.94 7.14 7.14 0 0 0 .06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.23 1.13-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/></svg>
        </button>
      </div>
      <div id="tab-bar" class="tab-bar-row">
        <div id="tab-bar-track" class="tab-bar-track"></div>
        <button id="tab-add-btn" class="icon-btn tab-add" data-tooltip="New Tab" aria-label="New Tab">+</button>
      </div>
    </div>

    <!-- Compact layout (Safari-style): tab bar and address bar merged into one row -->
    <div id="layout-compact">
      <div id="compact-toolbar"></div>
      <div id="compact-tab-strip" class="compact-tab-strip">
        <div id="compact-tab-track" class="compact-tab-track"></div>
        <button id="compact-add-btn" class="icon-btn compact-add" data-tooltip="New Tab" aria-label="New Tab">+</button>
      </div>
      <button class="icon-btn settings-toggle-btn" data-tooltip="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.14 7.14 0 0 0-.06.94 7.14 7.14 0 0 0 .06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.23 1.13-.55 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/></svg>
      </button>
    </div>

    <div id="bookmarks-bar" class="bookmarks-bar-row"></div>
    <div id="settings-panel" class="settings-panel"></div>
    <div id="loading-bar"></div>
  </div>

  <!-- Electron doesn't implement window.prompt(), so text input (e.g.
       renaming a tab group) uses this small in-page modal instead. -->
  <div id="text-prompt-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title"></div>
      <input type="text" class="modal-input" autocomplete="off" spellcheck="false" />
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-cancel">Cancel</button>
        <button type="button" class="modal-btn primary modal-ok">OK</button>
      </div>
    </div>
  </div>

  <script type="module" src="chrome.js"></script>
</body>
</html>
