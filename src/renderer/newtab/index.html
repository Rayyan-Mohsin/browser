<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>New Tab</title>
<style>
  :root { color-scheme: light dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    transition: background-color 200ms ease, color 200ms ease;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #1e1e1e; color: #f5f5f5; }
    #search-input { background: rgba(255, 255, 255, 0.08) !important; border-color: rgba(255, 255, 255, 0.12) !important; }
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 0 24px;
  }
  .wordmark { font-size: 28px; font-weight: 600; opacity: 0.85; letter-spacing: -0.01em; }
  #search-form { width: 100%; max-width: 560px; }
  #search-input {
    width: 100%;
    height: 52px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1px solid rgba(0, 0, 0, 0.12);
    background: rgba(0, 0, 0, 0.03);
    color: inherit;
    font-size: 16px;
    outline: none;
    box-sizing: border-box;
  }
  #search-input:focus { border-color: #0a84ff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">Browser</div>
    <form id="search-form">
      <input id="search-input" type="text" placeholder="Search or type a URL" autocomplete="off" spellcheck="false" />
    </form>
  </div>
  <script>
    // Deliberately self-contained (no preload/IPC): this page is loaded via
    // file:// and kept dependency-free like any other tab content, rather
    // than granted privileged access. It duplicates a minimal version of
    // the URL-vs-search heuristic in src/main/tabs/urlNormalize.js. The
    // active search engine's %s template is passed in via a query param
    // (set by TabManager.buildNewTabUrl) so this stays in sync with the
    // user's Settings choice without needing IPC.
    const params = new URLSearchParams(window.location.search);
    const engineTemplate = params.get('engine') || 'https://www.google.com/search?q=%s';

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('search-input').value.trim();
      if (!input) return;

      const urlLike = /^(https?:\/\/|file:\/\/|about:)/i.test(input);
      const hasSpace = /\s/.test(input);
      const bareHost = /^[a-z0-9.-]+\.[a-z]{2,}(:\d+)?(\/.*)?$/i.test(input);
      const localhost = /^localhost(:\d+)?(\/.*)?$/i.test(input);

      let target;
      if (urlLike) target = input;
      else if (!hasSpace && (bareHost || localhost)) target = `https://${input}`;
      else target = engineTemplate.replace('%s', encodeURIComponent(input));

      window.location.href = target;
    });
  </script>
</body>
</html>
